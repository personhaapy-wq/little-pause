<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Breathing Space · 호흡 명상</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--surface2:#f0f2f5;--text:#2d3748;--text-sub:#718096;--accent:#4a90a4;--accent-light:#e8f4f8;--border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:auto;padding:1.5rem 1rem 4rem}
.card{background:var(--surface);border-radius:12px;padding:1.25rem;box-shadow:var(--shadow);margin-bottom:1.25rem}
h1{font-size:1.35rem;margin:0 0 .2rem}h2{font-size:1.05rem;margin:0 0 1rem}.subtitle{color:var(--text-sub);font-size:.84rem;margin:0 0 1.4rem}
.datebar{display:flex;align-items:center;justify-content:center;gap:.75rem;margin-bottom:1.25rem}.nav-arrow{width:40px;height:40px;border:1px solid var(--border);border-radius:8px;background:white;color:var(--text-sub);font-size:1.1rem;cursor:pointer}.date-center{text-align:center;cursor:pointer}.date-main{font-weight:700;font-size:1.2rem}.date-sub{font-size:.78rem;color:var(--text-sub)}.today-btn{color:var(--accent);margin-left:.4rem}.date-picker{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.breath-slots{display:flex;gap:.5rem}.breath-slot{flex:1;min-height:44px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:.85rem;font-weight:700;cursor:pointer}.breath-slot.filled{background:var(--accent);color:white}.hint{font-size:.82rem;color:var(--text-sub);margin:.8rem 0 0}
#breathe-wrap{display:flex;flex-direction:column;align-items:center;padding:1.5rem 0;gap:1rem;min-height:0}
.circle-area{display:grid;place-items:center;min-height:195px}
#breathe-circle{width:130px;height:130px;border-radius:50%;background:var(--accent-light);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--accent);font-weight:600;transition:transform 4s ease-in-out,background 4s ease-in-out;will-change:transform;user-select:none}
#breathe-guide{font-size:.93rem;color:var(--text-sub);text-align:center}#breathe-counter{font-size:1.8rem;font-weight:300;font-variant-numeric:tabular-nums}
#breathe-min-row{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1rem;color:var(--text-sub);font-size:.93rem}#breathe-min{width:4.5rem;padding:.4rem;text-align:center;font-size:1rem;border:1px solid var(--accent);border-radius:8px;background:transparent;color:var(--text)}
#breathe-sound{display:flex;justify-content:center;align-items:center;gap:.6rem;margin-bottom:1rem;font-size:.93rem;color:var(--text-sub);cursor:pointer;user-select:none}#breathe-sound input{position:absolute;opacity:0;width:0;height:0}#breathe-sound .switch{position:relative;width:44px;height:24px;border-radius:999px;background:var(--text-sub);opacity:.45;transition:background .2s,opacity .2s}#breathe-sound .switch:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}#breathe-sound input:checked+.switch{background:var(--accent);opacity:1}#breathe-sound input:checked+.switch:after{transform:translateX(20px)}#breathe-sound input:focus-visible+.switch{outline:2px solid var(--accent);outline-offset:2px}
.flex-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.btn{padding:0 1.1rem;min-height:44px;border:0;border-radius:8px;cursor:pointer;font:inherit;font-size:.9rem}.btn-primary{background:var(--accent);color:white}.btn-secondary{background:var(--surface2);color:var(--text-sub)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:480px){main{padding:1.1rem .875rem 4rem}.card{padding:1.05rem}#breathe-circle{width:120px;height:120px}}
#phase-settings {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .65rem .8rem;
  margin: 0 0 1rem;
}
#phase-settings label {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  color: var(--text-sub);
  font-size: .85rem;
  white-space: nowrap;
}
#phase-settings input {
  width: 3.25rem;
  min-height: 40px;
  padding: .25rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  text-align: center;
  font: inherit;
  font-size: 1rem;
  appearance: textfield;
}
#phase-settings input::-webkit-inner-spin-button { appearance: none; }
#timer-settings[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
  #breathe-circle { transition-duration: 0s !important; }
}
</style></head>
<body>
<main>
<h1>호흡 명상</h1>
<section aria-label="날짜별 호흡 기록">
<div class="datebar"><button class="nav-arrow" aria-label="이전 날짜" onclick="shiftDay(-1)">‹</button><div class="date-center" onclick="openPicker()"><div class="date-main" id="date-main"></div><div class="date-sub" id="date-sub"></div><input class="date-picker" type="date" id="date-picker" onchange="pickDate(this.value)"></div><button class="nav-arrow" aria-label="다음 날짜" onclick="shiftDay(1)">›</button></div>
<div class="card"><h2>호흡 기록 <span id="breath-count" aria-live="polite" style="font-weight:400;font-size:.85rem;color:var(--text-sub)"></span></h2><div class="breath-slots" id="breath-slots"></div></div>
</section>
<section class="card" aria-label="호흡 타이머">
  <div id="breathe-wrap">
    <div class="circle-area"><div id="breathe-circle">준비</div></div>
    <div id="breathe-guide" role="status">아래 버튼을 눌러 시작하세요</div>
    <div id="breathe-counter" style="display:none"></div>
  </div>
  <div id="timer-settings">
    <label id="breathe-min-row"><input type="number" id="breathe-min" min="1" max="120" value="20" inputmode="numeric" aria-label="명상 시간(분)"> 분</label>
    <div id="phase-settings" role="group" aria-label="호흡 단계별 시간">
      <label>날숨 <input id="exhale-sec" type="number" min="1" max="120" value="10" inputmode="numeric" aria-label="날숨(초)"> 초</label>
      <label>들숨 <input id="inhale-sec" type="number" min="1" max="120" value="4" inputmode="numeric" aria-label="들숨(초)"> 초</label>
      <label>멈춤 <input id="hold-sec" type="number" min="0" max="120" value="1" inputmode="numeric" aria-label="멈춤(초)"> 초</label>
    </div>
  </div>
<label id="breathe-sound"><span>🔔 전환음</span><input type="checkbox" id="breathe-sound-toggle" onchange="setSoundMode(this.checked ? 'beep' : 'off')"><span class="switch"></span></label>
<div class="flex-row" style="justify-content:center"><button class="btn btn-primary" id="btn-start" onclick="startBreathe()">시작</button><button class="btn btn-secondary" id="btn-stop" onclick="stopBreathe()" style="display:none">중단</button></div>
</section>
<p class="hint">타이머를 마치면 호흡 기록이 1회 추가돼요. 하루 최대 3회까지 이 브라우저에 저장돼요.</p>
</main>
<script>
const STORAGE_KEY='breathing-space-days-v1';
let store={};
try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');if(data&&typeof data==='object'&&!Array.isArray(data))store=data;}catch(e){console.warn('로컬 기록을 읽지 못했습니다',e)}
function p(n){return String(n).padStart(2,'0')}
function toKey(d){return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
const WEEK=['일','월','화','수','목','금','토'];
function todayKey(){try{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const g=t=>parts.find(x=>x.type===t).value;return `${g('year')}-${g('month')}-${g('day')}`}catch(e){return toKey(new Date())}}
let curDate=todayKey();
function getDay(k){return structuredCloneSafe(store[k]||{})}
function structuredCloneSafe(d){return JSON.parse(JSON.stringify(d))}
function toArr(x){return Array.isArray(x)?x:[]}
function setDay(k,data){if(!data.breath && !toArr(data.breathLog).length)delete store[k];else store[k]=data;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store))}catch(e){alert('브라우저에 저장하지 못했어요. 저장공간 또는 브라우저 설정을 확인해 주세요.')}}
function renderDate(){const d=fromKey(curDate);document.getElementById('date-main').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`;const isToday=curDate===todayKey();const sub=document.getElementById('date-sub');sub.textContent=(isToday?'오늘 · ':'')+d.getFullYear();if(!isToday){const s=document.createElement('span');s.className='today-btn';s.textContent='오늘로';s.onclick=e=>{e.stopPropagation();goToday()};sub.appendChild(s)}}
function renderDay(){renderDate();renderBreathSlots()}
function shiftDay(n){const d=fromKey(curDate);d.setDate(d.getDate()+n);curDate=toKey(d);renderDay()}
function goToday(){curDate=todayKey();renderDay()}
function openPicker(){const pk=document.getElementById('date-picker');pk.value=curDate;if(pk.showPicker){try{pk.showPicker();return}catch(e){}}pk.focus();pk.click()}
function pickDate(v){if(v){curDate=v;renderDay()}}
// ── Breathing ──
const BREATH_PHASES = [
  { inputId: 'exhale-sec', label: '내쉬기', guide: '입으로 천천히 내쉬세요', scale: 1, bg: 'var(--accent-light)', beep: true },
  { inputId: 'inhale-sec', label: '들이쉬기', guide: '코로 들이쉬세요', scale: 1.5, bg: '#daeef6', beep: true },
  { inputId: 'hold-sec', label: '멈춤', guide: '잠시 멈추세요', scale: 1.5, bg: '#daeef6', beep: false },
];
const BREATH_MAX = 3;
let bTimer = null, bStart = 0, bTotalSec = 0, bDay = null;
let activePhases = [], cycleSeconds = 0, previousPhaseStart = -1;

function saveDuration(input) {
  const value = input.value === '' ? Number(input.defaultValue) : Math.round(Number(input.value));
  const seconds = Math.min(Number(input.max), Math.max(Number(input.min), value));
  input.value = String(seconds);
  try {
    localStorage.setItem(input.id === 'breathe-min' ? 'breatheMin' : input.id, String(seconds));
  } catch (e) {}
  return seconds;
}

let previousSeconds = [];
try {
  const saved = JSON.parse(localStorage.getItem('breathing-space-phase-seconds-v1'));
  if (Array.isArray(saved)) previousSeconds = saved;
} catch (e) {}

const durationIds = ['breathe-min', ...BREATH_PHASES.map(phase => phase.inputId)];
for (const [index, id] of durationIds.entries()) {
  const input = document.getElementById(id);
  try {
    const saved = localStorage.getItem(id === 'breathe-min' ? 'breatheMin' : id);
    const previous = index > 0 ? previousSeconds[index - 1] : undefined;
    if (saved !== null) input.value = saved;
    else if (Number.isInteger(previous)) input.value = String(previous);
  } catch (e) {}
  input.addEventListener('change', () => saveDuration(input));
}

// ── 소리: 'beep'(전환음) | 'off' ──
let soundMode = 'off';
try { soundMode = localStorage.getItem('breatheSound') === 'beep' ? 'beep' : 'off'; } catch (e) {}
function setSoundMode(m) {
  soundMode = m;
  try { localStorage.setItem('breatheSound', m); } catch (e) {}
  if (soundMode === 'beep') unlockAudio();
}
// "땃" 소리를 WAV로 만들어 <audio>로 재생
// (Web Audio는 iPhone 무음 스위치가 켜지면 안 들려서 미디어 재생 방식 사용)
let ttakAudio = null, audioUnlocked = false;
function makeTtakUrl() {
  const rate = 22050, len = Math.floor(rate * 0.12);
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, len * 2, true);
  for (let i = 0; i < len; i++) {
    const t = i / rate;
    const env = Math.min(1, t / 0.004) * Math.exp(-t / 0.03);
    const s = (Math.sin(2 * Math.PI * 1000 * t) + 0.4 * Math.sin(2 * Math.PI * 2000 * t)) / 1.4;
    v.setInt16(44 + i * 2, Math.round(s * env * 0.6 * 32767), true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
// 사용자 탭(시작/토글) 안에서 한 번 재생해 둬야 이후 자동 재생이 허용됨
function unlockAudio() {
  try {
    if (!ttakAudio) { ttakAudio = new Audio(makeTtakUrl()); ttakAudio.preload = 'auto'; }
    if (audioUnlocked) return;
    ttakAudio.muted = true;
    const pr = ttakAudio.play();
    const done = () => { ttakAudio.pause(); ttakAudio.currentTime = 0; ttakAudio.muted = false; audioUnlocked = true; };
    if (pr && pr.then) pr.then(done).catch(() => { ttakAudio.muted = false; }); else done();
  } catch (e) {}
}
function playTtak() {
  if (!ttakAudio) return;
  try {
    ttakAudio.muted = false;
    ttakAudio.currentTime = 0;
    const pr = ttakAudio.play();
    if (pr && pr.catch) pr.catch(() => {});
  } catch (e) {}
}

function startBreathe() {
  if (bTimer !== null) return;
  const minutes = saveDuration(document.getElementById('breathe-min'));
  activePhases = BREATH_PHASES.map(phase => ({
    ...phase,
    sec: saveDuration(document.getElementById(phase.inputId)),
  })).filter(phase => phase.sec > 0);
  cycleSeconds = activePhases.reduce((total, phase) => total + phase.sec, 0);
  if (soundMode === 'beep') unlockAudio();

  // 설정 시간이 지나도 마지막 호흡 주기를 끝까지 진행합니다.
  bTotalSec = Math.ceil(minutes * 60 / cycleSeconds) * cycleSeconds;
  bStart = Date.now();
  previousPhaseStart = -1;
  bDay = todayKey();
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = '';
  document.getElementById('timer-settings').hidden = true;
  document.getElementById('breathe-counter').style.display = '';
  // 날숨은 커진 상태에서 줄어들며 시작
  const circle = document.getElementById('breathe-circle');
  circle.style.transition = 'none';
  circle.style.transform = 'scale(1.5)';
  circle.style.background = '#daeef6';
  void circle.offsetWidth;
  breatheTick();
}
// 1초마다 실행. 시작 시각 기준으로 예약해서 오차가 쌓이지 않음
function breatheTick() {
  const bSec = Math.max(0, Math.floor((Date.now() - bStart) / 1000));
  if (bSec >= bTotalSec) { finishBreathe(); return; }
  const circle = document.getElementById('breathe-circle');
  const left = bTotalSec - bSec;
  document.getElementById('breathe-counter').textContent = `${Math.floor(left / 60)}:${p(left % 60)}`;

  // 사이클 안에서 현재 단계와 단계 내 몇 초째인지
  let pos = bSec % cycleSeconds, idx = 0;
  while (pos >= activePhases[idx].sec) { pos -= activePhases[idx].sec; idx++; }
  const ph = activePhases[idx], n = pos + 1;

  const phaseStart = bSec - pos;
  if (phaseStart !== previousPhaseStart) {
    previousPhaseStart = phaseStart;
    const remaining = ph.sec - pos;
    circle.style.transition = `transform ${remaining}s ease-in-out, background ${remaining}s ease-in-out`;
    circle.style.transform = `scale(${ph.scale})`;
    circle.style.background = ph.bg;
    document.getElementById('breathe-guide').textContent = `${ph.guide} (${ph.sec}초)`;
    if (soundMode === 'beep' && ph.beep) playTtak();
  }
  circle.textContent = `${ph.label} ${n}`;

  bTimer = setTimeout(breatheTick, Math.max(0, bStart + (bSec + 1) * 1000 - Date.now()));
}
function finishBreathe() {
  const k = bDay || todayKey();
  stopBreathe();
  const day = getDay(k);
  day.breath = Math.min(BREATH_MAX, (day.breath || 0) + 1);
  day.breathLog = toArr(day.breathLog).concat({ sec: bTotalSec, at: Date.now() });
  setDay(k, day);
  curDate = k;
  renderDay();
  document.getElementById('breathe-circle').textContent = '완료';
  document.getElementById('breathe-guide').textContent = `수고했어요. 호흡 기록 ${day.breath} / ${BREATH_MAX}회`;
}
function renderBreathSlots() {
  const wrap = document.getElementById('breath-slots');
  if (!wrap) return;
  const n = getDay(curDate).breath || 0;
  wrap.innerHTML = '';
  for (let i = 0; i < BREATH_MAX; i++) {
    const b = document.createElement('button');
    b.className = 'breath-slot' + (i < n ? ' filled' : '');
    b.type = 'button';
    b.textContent = i < n ? `✓ ${i + 1}회` : `${i + 1}회`;
    b.setAttribute('aria-pressed', String(i < n));
    b.onclick = () => toggleBreathSlot(i);
    wrap.appendChild(b);
  }
  document.getElementById('breath-count').textContent = `${n} / ${BREATH_MAX}`;
}
// 칸 탭: 비어 있으면 그 칸까지 채우고, 채워진 마지막 칸이면 하나 비움
function toggleBreathSlot(i) {
  const day = getDay(curDate);
  const n = day.breath || 0;
  day.breath = (i === n - 1) ? n - 1 : i + 1;
  if (!day.breath) delete day.breath;
  setDay(curDate, day);
  renderBreathSlots();
}
document.getElementById('breathe-sound-toggle').checked = soundMode === 'beep';

function stopBreathe() {
  if (bTimer !== null) { clearTimeout(bTimer); bTimer = null; }
  document.getElementById('timer-settings').hidden = false;
  const circle = document.getElementById('breathe-circle');
  circle.textContent = '준비';
  circle.style.transition = 'none';
  circle.style.transform = 'scale(1)';
  circle.style.background = 'var(--accent-light)';
  document.getElementById('breathe-guide').textContent = '아래 버튼을 눌러 시작하세요';
  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('breathe-counter').style.display = 'none';
}


renderDay();
</script>
</body>
</html>
